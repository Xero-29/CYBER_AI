name: Python tests

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
      - name: Validate source and installer syntax
        run: |
          bash -n setup.sh verify.sh
      - name: Protect checked-out runtime data directories
        run: |
          if [[ -d data && ! -L data ]]; then
            find data -type d -exec chmod 700 {} +
          fi
      - name: Run complete local verification
        run: bash verify.sh
      - name: Capture hashes for resolved dependency wheels
        run: |
          mkdir -p "$RUNNER_TEMP/cyber-ai-wheelhouse"
          python -m pip download --require-hashes --only-binary=:all: \
            --dest "$RUNNER_TEMP/cyber-ai-wheelhouse" \
            -r requirements.lock
          python dependency_artifact_manifest.py \
            --wheelhouse "$RUNNER_TEMP/cyber-ai-wheelhouse" \
            --output "$RUNNER_TEMP/cyber-ai-dependency-artifacts.json"
      - name: Verify hardened sandbox tool lock
        run: |
          mkdir -p "$RUNNER_TEMP/sandbox-wheelhouse"
          python -m pip download --require-hashes --only-binary=:all: --dest "$RUNNER_TEMP/sandbox-wheelhouse" -r sandbox/requirements.lock
          python dependency_artifact_manifest.py --lock-file sandbox/requirements.lock --wheelhouse "$RUNNER_TEMP/sandbox-wheelhouse" --output "$RUNNER_TEMP/sandbox-dependency-artifacts.json"
      - name: Verify optional document dependency lock
        run: |
          mkdir -p "$RUNNER_TEMP/document-wheelhouse"
          python -m pip download --require-hashes --only-binary=:all: --dest "$RUNNER_TEMP/document-wheelhouse" -r requirements-documents.lock
          python dependency_artifact_manifest.py --lock-file requirements-documents.lock --wheelhouse "$RUNNER_TEMP/document-wheelhouse" --output "$RUNNER_TEMP/document-dependency-artifacts.json"
      - name: Install optional document dependencies
        run: python -m pip install --require-hashes -r requirements-documents.lock
      - name: Verify full suite with document extractors enabled
        run: bash verify.sh
      - name: Generate CycloneDX SBOM
        run: |
          python sbom_generator.py \
            --artifact-manifest "$RUNNER_TEMP/cyber-ai-dependency-artifacts.json" \
            --output "$RUNNER_TEMP/cyber-ai-sbom.cdx.json"
          python sbom_generator.py --lock-file sandbox/requirements.lock --direct-requirements sandbox/requirements.in --artifact-manifest "$RUNNER_TEMP/sandbox-dependency-artifacts.json" --output "$RUNNER_TEMP/sandbox-sbom.cdx.json"
          python sbom_generator.py --lock-file requirements-documents.lock --direct-requirements requirements-documents.in --artifact-manifest "$RUNNER_TEMP/document-dependency-artifacts.json" --output "$RUNNER_TEMP/document-sbom.cdx.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import hashlib

          root = Path(".")
          lock_hash = hashlib.sha256((root / "requirements.lock").read_bytes()).hexdigest()
          sandbox_lock_hash = hashlib.sha256((root / "sandbox/requirements.lock").read_bytes()).hexdigest()
          document_lock_hash = hashlib.sha256((root / "requirements-documents.lock").read_bytes()).hexdigest()
          provenance = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sbom": "cyber-ai-sbom.cdx.json",
              "sboms": [
                  "cyber-ai-sbom.cdx.json",
                  "sandbox-sbom.cdx.json",
                  "document-sbom.cdx.json",
              ],
              "requirements_lock_sha256": lock_hash,
              "sandbox_requirements_lock_sha256": sandbox_lock_hash,
              "document_requirements_lock_sha256": document_lock_hash,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "cyber-ai-sbom-provenance.json"
          output.write_text(json.dumps(provenance, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload SBOM and build provenance
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: cyber-ai-sbom-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cyber-ai-sbom.cdx.json
            ${{ runner.temp }}/cyber-ai-sbom-provenance.json
            ${{ runner.temp }}/cyber-ai-dependency-artifacts.json
            ${{ runner.temp }}/sandbox-dependency-artifacts.json
            ${{ runner.temp }}/sandbox-sbom.cdx.json
            ${{ runner.temp }}/document-dependency-artifacts.json
            ${{ runner.temp }}/document-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  windows-allowlist-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Test signed executable allowlist on Windows
        run: python -m unittest discover -s tests -p test_tool_allowlist.py -v
