name: Docker sandbox

on:
  push:
    branches:
      - codex/security-integrity-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Build sandbox image
        run: |
          docker build --pull --no-cache \
            --tag cyber-ai-tool-sandbox:ci \
            --file sandbox/Dockerfile .

      - name: Protect checked-out runtime data directories
        run: |
          if [[ -d data && ! -L data ]]; then
            find data -type d -exec chmod 700 {} +
          fi

      - name: Run complete local verification
        env:
          CYBER_AI_TOOL_ALLOWLIST_REQUIRED: "0"
        run: bash verify.sh

      - name: Run Ruff inside hardened sandbox
        run: |
          set -euo pipefail
          allowlist_dir="$RUNNER_TEMP/cyber-ai-tool-allowlist"
          mkdir -m 700 "$allowlist_dir"
          trap 'rm -rf "$allowlist_dir"' EXIT
          ruff_sha256="$(docker run --rm --network=none --entrypoint python cyber-ai-tool-sandbox:ci -c 'import hashlib, pathlib, shutil; path=shutil.which("ruff"); assert path; print(hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest())')"
          export CYBER_AI_TOOL_ALLOWLIST_PATH="$allowlist_dir/tools.json"
          export CYBER_AI_TOOL_ALLOWLIST_HMAC_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python3 - "$CYBER_AI_TOOL_ALLOWLIST_PATH" "$ruff_sha256" <<'PY'
          import json
          import os
          import re
          import sys

          from tool_allowlist import sign_tool_allowlist

          destination = sys.argv[1]
          digest = sys.argv[2]
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("El hash del ejecutable Ruff no es válido.")
          document = sign_tool_allowlist(
              {"ruff": {"sha256": digest}},
              os.environ["CYBER_AI_TOOL_ALLOWLIST_HMAC_KEY"].encode("utf-8"),
          )
          payload = (json.dumps(
              document, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ) + "\n").encode("utf-8")
          descriptor = os.open(
              destination,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL,
              0o600,
          )
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(payload)
              stream.flush()
              os.fsync(stream.fileno())
          os.chmod(destination, 0o600)
          PY
          python3 sandbox_runner.py \
            --tool ruff \
            --target tests/fixtures/sandbox_sample.py \
            --image cyber-ai-tool-sandbox:ci \
            --evidence-dir "$RUNNER_TEMP/cyber-ai-evidence" \
            --execute

      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cyber-ai-sandbox-evidence
          path: ${{ runner.temp }}/cyber-ai-evidence/
          if-no-files-found: ignore
          retention-days: 7
