name: Docker sandbox

on:
  push:
    branches:
      - codex/security-integrity-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.lock

      - name: Build sandbox image
        run: |
          docker build --pull --no-cache \
            --tag cyber-ai-tool-sandbox:ci \
            --file sandbox/Dockerfile .

      - name: Run complete local verification
        run: bash verify.sh

      - name: Run Ruff inside hardened sandbox
        run: |
          python3 sandbox_runner.py \
            --tool ruff \
            --target tests/fixtures/sandbox_sample.py \
            --image cyber-ai-tool-sandbox:ci \
            --evidence-dir "$RUNNER_TEMP/cyber-ai-evidence" \
            --execute

      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: cyber-ai-sandbox-evidence
          path: ${{ runner.temp }}/cyber-ai-evidence/
          if-no-files-found: ignore
          retention-days: 7
