name: Docker sandbox

on:
  push:
    branches:
      - codex/security-integrity-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Build sandbox image
        run: |
          docker build --pull --no-cache \
            --tag cyber-ai-tool-sandbox:ci \
            --file sandbox/Dockerfile .

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Ruff inside hardened sandbox
        run: |
          python3 sandbox_runner.py \
            --tool ruff \
            --target tests/fixtures/sandbox_sample.py \
            --image cyber-ai-tool-sandbox:ci \
            --evidence-dir "$RUNNER_TEMP/cyber-ai-evidence" \
            --execute

      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cyber-ai-sandbox-evidence
          path: ${{ runner.temp }}/cyber-ai-evidence/
          if-no-files-found: ignore
          retention-days: 7
